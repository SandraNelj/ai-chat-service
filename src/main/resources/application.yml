# src/main/resources/application.yml
spring:
  application:
    name: ai-chat-service

# OpenAI API-konfiguration
openai:
  api:
    key: ${OPENAI_API_KEY}
    url: ${OPENAI_API_URL:https://openrouter.ai/api/v1}
    model: ${OPENAI_API_MODEL:google/gemini-2.5-flash-lite}

# Server
server:
  port: 8080

# Logging
logging:
  level:
    com.example.aichatservice: DEBUG