# src/main/resources/application.yml
spring:
  application:
    name: ai-chat-service

# OpenRouter API-konfiguration
openrouter:
  api:
    key: ${OPENROUTER_API_KEY}
    url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_API_MODEL:google/gemini-2.5-flash-lite}

# Server
server:
  port: 8080

# Logging
logging:
  level:
    com.example.aichatservice: DEBUG