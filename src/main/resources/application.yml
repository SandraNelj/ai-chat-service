# src/main/resources/application.yml
spring:
  application:
    name: ai-chat-service

# OpenAI API-konfiguration
openai:
  api:
    key: ${OPENAI_API_KEY:placeholder}
    url: ${OPENAI_API_URL:https://api.openai.com/v1}
    model: gpt-3.5-turbo

# Server
server:
  port: 8080

# Logging
logging:
  level:
    com.example.aichatservice: DEBUG